name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pebble

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pebble build

      - uses: actions/upload-artifact@v4
        with:
          name: next-bus-pbw
          path: build/pebble-bus.pbw
          if-no-files-found: error

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: next-bus-pbw
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pbw="next-bus-$GITHUB_REF_NAME.pbw"
          mv pebble-bus.pbw "$pbw"
          gh release create "$GITHUB_REF_NAME" "$pbw" --repo "$GITHUB_REPOSITORY" \
            --title "Next Bus $GITHUB_REF_NAME" --generate-notes

  appstore:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      REFRESH_TOKEN: ${{ secrets.PEBBLE_FIREBASE_REFRESH_TOKEN }}
    steps:
      - name: Check for app store credentials
        id: creds
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "::warning::PEBBLE_FIREBASE_REFRESH_TOKEN is not set, skipping the Pebble app store (see README)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: ./.github/actions/setup-pebble
        if: steps.creds.outputs.ok == 'true'

      - name: Publish to the Pebble app store
        if: steps.creds.outputs.ok == 'true'
        run: |
          # Firebase ID tokens last an hour, so store the long-lived refresh
          # token as the secret and exchange it here, with pebble-tool's
          # public Firebase API key.
          api_key=$("$(uv tool dir)/pebble-tool/bin/python" -c \
            'from pebble_tool.firebase_account import DEFAULT_FIREBASE_API_KEY as k; print(k)')
          id_token=$(curl -fsS "https://securetoken.googleapis.com/v1/token?key=$api_key" \
            --data-urlencode grant_type=refresh_token \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" | jq -r .id_token)
          echo "::add-mask::$id_token"
          export PEBBLE_FIREBASE_ID_TOKEN="$id_token"

          # The store reads the platform from the file name prefix.
          mkdir -p appstore
          for name in destinations departures map map-stop; do
            cp "docs/screenshots/london-$name.png" "appstore/emery_$name.png"
          done

          # pebble publish builds the app itself. --description is only used
          # the first time, when it creates the store listing.
          pebble publish --non-interactive --is-published \
            --no-gif-all-platforms --replace-screenshots \
            --screenshots appstore/emery_destinations.png appstore/emery_departures.png \
                          appstore/emery_map.png appstore/emery_map-stop.png \
            --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --release-notes "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --description "The next buses from where you are to the places you save in the settings: countdown, when to leave, arrival time and a map of the boarding stop. Worldwide timetables from Transitous, live times for London buses from TfL." \
            < /dev/null
